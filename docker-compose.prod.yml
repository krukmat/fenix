version: '3.9'

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      bff:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    expose:
      - "8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the production environment}
      - DATABASE_URL=/data/fenixcrm.db
      - BFF_ORIGIN=${BFF_ORIGIN:?BFF_ORIGIN must be set to the public BFF origin}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must list approved browser origins}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:?OLLAMA_MODEL must name the embedding model}
      - CHAT_PROVIDER=openai-compat
      - EMBED_PROVIDER=ollama
      - OPENAI_COMPAT_BASE_URL=${OPENAI_COMPAT_BASE_URL:?OPENAI_COMPAT_BASE_URL must be set}
      - OPENAI_COMPAT_API_KEY=${OPENAI_COMPAT_API_KEY:?OPENAI_COMPAT_API_KEY must be set}
      - OPENAI_COMPAT_MODEL=${OPENAI_COMPAT_MODEL:?OPENAI_COMPAT_MODEL must be set}
    volumes:
      - ${FENIX_DATA_DIR:?FENIX_DATA_DIR must point to the mounted DigitalOcean Volume}:/data
    depends_on:
      ollama:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error http://localhost:8080/readyz | grep -q '"status":"ready"'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  bff:
    build:
      context: .
      dockerfile: deploy/Dockerfile.bff
    expose:
      - "3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - NODE_ENV=production
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set in the production environment}
      - BFF_CORS_ALLOWED_ORIGINS=${BFF_CORS_ALLOWED_ORIGINS:?BFF_CORS_ALLOWED_ORIGINS must list approved browser origins}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/bff/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ${FENIX_OLLAMA_DIR:?FENIX_OLLAMA_DIR must point to persistent model storage}:/root/.ollama
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
