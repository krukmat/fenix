name: B2A2 QA one-shot (temporary, no deployment)

on:
  push:
    branches:
      - feature/int-v2-dubbridge-consumes-fenix
    paths:
      - .github/workflows/b2a2-qa-once.yml

permissions:
  contents: read

jobs:
  qa:
    name: Go 1.25.13 B2A2 and repository QA
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Go 1.25.13
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: true
      - name: Run read-only verification; collect all gate results
        shell: bash
        env:
          GOTOOLCHAIN: go1.25.13
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -uo pipefail
          mkdir -p /tmp/b2a2-qa-once
          printf 'gate\texit_code\n' > /tmp/b2a2-qa-once/results.tsv
          run_gate() {
            local gate="$1" limit="$2"; shift 2
            echo "::group::${gate}"
            timeout "${limit}" bash -lc "$*" > "/tmp/b2a2-qa-once/${gate}.log" 2>&1
            local rc=$?
            echo "Gate ${gate} exit=${rc}"
            tail -n 70 "/tmp/b2a2-qa-once/${gate}.log" || true
            printf '%s\t%s\n' "$gate" "$rc" >> /tmp/b2a2-qa-once/results.tsv
            echo '::endgroup::'
          }
          go version
          git rev-parse HEAD
          run_gate mandatory_prepush 24m 'bash scripts/qa-go-prepush.sh'
          run_gate focused_race 12m 'go test -race -count=3 ./internal/domain/auth ./internal/infra/sqlite'
          run_gate full_go_tests 14m 'go test ./...'
          run_gate complexity 8m 'make complexity'
          run_gate lint 11m 'make lint'
          run_gate wrapcheck 9m 'make wrapcheck-gate'
          run_gate coverage 9m 'make coverage-gate && make coverage-tdd'
          run_gate race_stability 10m 'RACE_STABILITY_COUNT=1 make race-stability'
          run_gate pattern_refactor 5m 'make pattern-refactor-gate'
          run_gate vulnerability 7m 'go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...'
          run_gate deadcode 8m 'go install golang.org/x/tools/cmd/deadcode@latest && "$(go env GOPATH)/bin/deadcode" -test ./...'
          echo '### B2.A2 one-shot Go QA (no deployment)' >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/b2a2-qa-once/results.tsv >> "$GITHUB_STEP_SUMMARY"
          echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          if awk -F '\t' 'NR>1 && $2 != 0 {failed=1} END {exit !failed}' /tmp/b2a2-qa-once/results.tsv; then
            echo 'One or more QA gates failed; see log artifact. This is NOT a security acceptance.'
            exit 1
          fi
      - name: Upload diagnostics without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2a2-one-shot-qa-results
          path: /tmp/b2a2-qa-once/
          if-no-files-found: warn
          retention-days: 7
